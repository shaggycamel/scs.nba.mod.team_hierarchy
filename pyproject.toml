[project]
name = "team-hierarchy"
version = "0.1.0"
description = "Point-in-time NBA depth charts, availability and minutes absorption"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lightgbm>=4.7.0,<5",
    "numpy>=2.0,<3",
    "polars>=1.44.2,<2",
    "pyarrow>=25.0.1,<26",
    "scikit-learn>=1.9.1,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/team_hierarchy"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
